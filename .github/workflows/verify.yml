name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rms_test
          POSTGRES_PASSWORD: rms-test-placeholder
          POSTGRES_DB: rms_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U rms_test -d rms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RMS_TEST_ONLY: 'yes'
      DB_URL: jdbc:postgresql://127.0.0.1:55432/rms_test
      DB_USER: rms_test
      DB_PASSWORD: rms-test-placeholder
      APP_BIND: 127.0.0.1
      APP_PORT: '18080'
      APP_SECURE_COOKIE: 'false'
      SHOP_ORIGIN: http://127.0.0.1:18080
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          npm ci --prefix frontend
          npm audit --prefix frontend --audit-level=high
          npm run --prefix frontend build
      - run: bash ./mvnw -B verify
      - name: Check the running site
        shell: bash
        run: |
          set -euo pipefail
          export OWNER_LOGIN=local-owner OWNER_NAME='CI Test Owner'
          export OWNER_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$OWNER_PASSWORD"
          export MEDIA_DIR="$RUNNER_TEMP/rms-media"
          jar=target/Real_Mobil_Shop_Sayt-0.0.1-SNAPSHOT.jar
          java -jar "$jar" bootstrap-owner
          java -jar "$jar" > "$RUNNER_TEMP/rms.log" 2>&1 &
          app=$!
          trap 'kill "$app" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if curl -fsS "$SHOP_ORIGIN/api/v1/categories" >/dev/null; then break; fi
            if ! kill -0 "$app" 2>/dev/null; then tail -100 "$RUNNER_TEMP/rms.log"; exit 1; fi
            sleep 1
          done
          node scripts/check-api.mjs
