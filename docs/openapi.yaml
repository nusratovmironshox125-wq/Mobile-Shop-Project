openapi: 3.1.0
info: {"title":"Real Mobil Shop","version":"1.3.0","description":"Исправления 11.11.2026. Списки по 10, page от 0, другое целочисленное size нормализуется к 10. Навигационные категории и bounded by-ids не являются таблицами."}
servers: [{"url":"/api/v1"}]
paths:
