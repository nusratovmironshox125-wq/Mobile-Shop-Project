  /admin/categories:
    get: {"summary":"Категории","description":"Требуется сессия сотрудника.","security":[{"session":[]}],"responses":{"200":{"description":"Успех","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/Category"}}}}},"default":{"$ref":"#/components/responses/Error"}}}
    post: {"summary":"Создание категории","description":"Требуется сессия сотрудника.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/CategoryEdit"}}}},"security":[{"csrf":[],"session":[]}],"responses":{"201":{"description":"Успех","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Category"}}}},"default":{"$ref":"#/components/responses/Error"}}}
  /admin/categories/{id}:
