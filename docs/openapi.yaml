    patch: {"summary":"Изменение товара","description":"Требуется сессия сотрудника.","parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"integer","minimum":1}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ProductEdit"}}}},"security":[{"csrf":[],"session":[]}],"responses":{"200":{"description":"Успех","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Product"}}}},"default":{"$ref":"#/components/responses/Error"}}}
  /admin/products/{id}/variants:
    post: {"summary":"Добавление комплектации","description":"Требуется сессия сотрудника.","parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"integer","minimum":1}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/VariantEdit"}}}},"security":[{"csrf":[],"session":[]}],"responses":{"201":{"description":"Успех","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Variant"}}}},"default":{"$ref":"#/components/responses/Error"}}}
  /admin/products/{id}/variants/{variantId}:
    patch: {"summary":"Изменение комплектации","description":"Требуется сессия сотрудника.","parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"integer","minimum":1}},{"name":"variantId","in":"path","required":true,"schema":{"type":"integer","minimum":1}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/VariantEdit"}}}},"security":[{"csrf":[],"session":[]}],"responses":{"200":{"description":"Успех","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Variant"}}}},"default":{"$ref":"#/components/responses/Error"}}}
  /admin/products/{id}/images:
