    post: {"summary":"Создание ADMIN","description":"Требуется роль OWNER.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/UserCreate"}}}},"security":[{"csrf":[],"session":[]}],"responses":{"201":{"description":"Успех","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Issued"}}}},"default":{"$ref":"#/components/responses/Error"}}}
  /admin/users/{id}:
