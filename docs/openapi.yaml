  /categories:
    get: {"summary":"Видимые категории","responses":{"200":{"description":"Успех","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/Category"}}}}},"default":{"$ref":"#/components/responses/Error"}}}
  /products:
    get: {"summary":"Каталог","parameters":[{"name":"category","in":"query","required":false,"schema":{"type":"string","maxLength":100}},{"name":"q","in":"query","required":false,"schema":{"type":"string","maxLength":100}},{"name":"minPrice","in":"query","required":false,"schema":{"type":"number","minimum":0,"multipleOf":0.01}},{"name":"maxPrice","in":"query","required":false,"schema":{"type":"number","minimum":0,"multipleOf":0.01}},{"name":"discounted","in":"query","required":false,"schema":{"type":"boolean"}},{"name":"sort","in":"query","required":false,"schema":{"type":"string","enum":["new","price-asc","price-desc"]}},{"name":"page","in":"query","required":false,"schema":{"type":"integer","minimum":0,"maximum":10000,"default":0}},{"name":"size","in":"query","description":"Нормализуется к 10","schema":{"type":"integer","default":10}}],"responses":{"200":{"description":"Успех","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Catalog"}}}},"default":{"$ref":"#/components/responses/Error"}}}
  /products/by-ids:
