    patch: {"summary":"Изменение настроек","description":"Требуется сессия сотрудника.","requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SettingsEdit"}}}},"security":[{"csrf":[],"session":[]}],"responses":{"200":{"description":"Успех","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Settings"}}}},"default":{"$ref":"#/components/responses/Error"}}}
  /admin/leads:
