spring.application.name=Real_Mobil_Shop_Sayt
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/real_mobil_shop_sayt}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:12}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.data-source-properties.options=-c statement_timeout=4000
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.user=${DB_MIGRATION_USER:${DB_USER}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.address=${APP_BIND:127.0.0.1}
server.port=${APP_PORT:8080}
server.forward-headers-strategy=none
server.shutdown=graceful
server.tomcat.threads.max=80
server.tomcat.accept-count=100
server.tomcat.connection-timeout=5s
server.tomcat.max-http-form-post-size=64KB
server.max-http-request-header-size=16KB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_SECURE_COOKIE:true}
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
shop.media-dir=${MEDIA_DIR:./var/media}
shop.origin=${SHOP_ORIGIN:http://localhost:8080}
shop.privacy-version=${PRIVACY_VERSION:dev-v1}
shop.privacy-ru=${PRIVACY_RU:Магазин использует имя и телефон для ответа на заявку.}
shop.privacy-uz=${PRIVACY_UZ:Do‘kon arizaga javob berish uchun ism va telefon raqamidan foydalanadi.}
shop.phone-regions=${PHONE_REGIONS:UZ}
shop.retention-days=${RETENTION_DAYS:180}
shop.telegram.token=${TELEGRAM_BOT_TOKEN:}
shop.telegram.chat=${TELEGRAM_CHAT_ID:}
shop.limits.login-account=${LIMIT_LOGIN_ACCOUNT:5}
shop.limits.login-source=${LIMIT_LOGIN_SOURCE:30}
shop.limits.lead-session=${LIMIT_LEAD_SESSION:3}
shop.limits.lead-phone=${LIMIT_LEAD_PHONE:5}
shop.limits.lead-source=${LIMIT_LEAD_SOURCE:180}
shop.limits.csrf-source=${LIMIT_CSRF_SOURCE:400}
shop.limits.search-source=${LIMIT_SEARCH_SOURCE:1200}
shop.limits.search-client=${LIMIT_SEARCH_CLIENT:30}
shop.limits.search-burst=${LIMIT_SEARCH_BURST:10}
